<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Lumia Story</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: #faf9f7;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 3rem 1.5rem;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e8e4df;
      border-radius: 16px;
      padding: 3rem 3.5rem;
      max-width: 720px;
      width: 100%;
    }

    .header {
      margin-bottom: 2.5rem;
    }

    .label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #9b91a8;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: 22px;
      font-weight: 400;
      color: #1a1a1a;
      line-height: 1.3;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.6rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .count, .timer {
      font-size: 13px;
      color: #a09898;
    }

    .prog {
      height: 3px;
      background: #ede9e4;
      border-radius: 2px;
      margin-bottom: 2.5rem;
    }

    .prog-fill {
      height: 3px;
      background: #9b91a8;
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s;
    }

    .story {
      font-size: 19px;
      line-height: 2.6;
      color: #1a1a1a;
    }

    .bw {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: bottom;
      margin: 0 2px;
    }

    .b {
      border: none;
      border-bottom: 2px solid #c5badc;
      background: transparent;
      font-size: 19px;
      font-family: Georgia, 'Times New Roman', serif;
      color: #1a1a1a;
      outline: none;
      padding: 1px 4px;
      text-align: center;
      transition: border-color 0.15s;
      min-width: 40px;
    }

    .b:focus {
      border-bottom-color: #7f6fa8;
    }

    .b.done {
      border-bottom-color: #5daa8f;
      color: #2d6e5a;
    }

    .b::placeholder {
      color: #c5badc;
      font-style: italic;
      font-size: 14px;
    }

    .hint {
      font-size: 11px;
      color: #b0a8a8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-style: normal;
      white-space: nowrap;
      margin-top: 2px;
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
    }

    .b:focus ~ .hint {
      opacity: 1;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 2.5rem;
      flex-wrap: wrap;
    }

    button {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      font-weight: 500;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid #ddd8d0;
      color: #888;
    }

    .btn-ghost:hover {
      background: #f5f3f0;
    }

    .btn-main {
      background: #f0edf8;
      border: 1px solid #c5badc;
      color: #4a3d7a;
    }

    .btn-main:hover {
      background: #e3ddf2;
    }

    .result {
      margin-top: 2.5rem;
      background: #faf9f7;
      border: 1px solid #e8e4df;
      border-radius: 12px;
      padding: 1.75rem 2rem;
      display: none;
    }

    .result-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #a09898;
      margin-bottom: 1.25rem;
    }

    .result-story {
      font-size: 19px;
      line-height: 2.6;
      color: #1a1a1a;
    }

    .result-story em {
      color: #5a4a8a;
      font-style: normal;
      font-weight: 600;
    }

    @media (max-width: 600px) {
      .card { padding: 2rem 1.5rem; }
      .story, .result-story { font-size: 17px; }
      .b { font-size: 17px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="label">Lumia Essentials — graduation day</div>
      <h1>Fill in the blanks, then read your story aloud.</h1>
    </div>

    <div class="meta-row">
      <span class="count" id="count">0 of 11 filled</span>
      <span class="timer" id="timer">0:00</span>
    </div>
    <div class="prog"><div class="prog-fill" id="bar"></div></div>

    <div class="story" id="story"></div>

    <div class="actions">
      <button class="btn-ghost" onclick="clearAll()">Start over</button>
      <button class="btn-main" onclick="showResult()">Read my story →</button>
    </div>

    <div class="result" id="result">
      <div class="result-label">Your story</div>
      <div class="result-story" id="result-text"></div>
    </div>
  </div>

  <script>
    const parts = [
      {t: "Fresh out of Lumia Essentials and absolutely "},
      {blank:true, ph:"adjective", hint:"not 'fine'. how do you really feel?", w:100},
      {t: ", "},
      {blank:true, ph:"your name", hint:"that's you", w:90},
      {t: " burst into the world with a coaching certificate, a lot of "},
      {blank:true, ph:"noun", hint:"feelings? questions? audacity?", w:100},
      {t: ", and a dream to help "},
      {blank:true, ph:"your people", hint:"who you serve", w:110},
      {t: " finally feel "},
      {blank:true, ph:"feeling", hint:"what you give your clients", w:90},
      {t: ". Did the Lumia grads know exactly what they were doing? "},
      {blank:true, ph:"one word", hint:"be honest", w:80},
      {t: ". Did that stop them? Also "},
      {blank:true, ph:"one word", hint:"same answer?", w:80},
      {t: ". Backed by a crew of equally "},
      {blank:true, ph:"adjective", hint:"how would you describe your classmates?", w:110},
      {t: " humans who collectively navigated "},
      {blank:true, ph:"something from the course", hint:"a concept, a moment, a breakthrough...", w:180},
      {t: ", they agreed on one sacred rule: "},
      {blank:true, ph:"your motto", hint:"how you'll do this", w:160},
      {t: ". And so they did — with great: "},
      {blank:true, ph:"adverb", hint:"how you'll show up", w:110},
      {t: ", and with great hair. The end. (The beginning, actually.)"},
    ];

    const storyEl = document.getElementById('story');
    const total = parts.filter(p => p.blank).length;
    let started = false, interval = null, secs = 0;

    parts.forEach(p => {
      if (!p.blank) {
        storyEl.appendChild(document.createTextNode(p.t));
      } else {
        const wrap = document.createElement('span');
        wrap.className = 'bw';
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.className = 'b';
        inp.placeholder = p.ph;
        inp.style.width = p.w + 'px';
        inp.addEventListener('focus', startTimer);
        inp.addEventListener('input', update);
        const hint = document.createElement('span');
        hint.className = 'hint';
        hint.textContent = p.hint;
        wrap.appendChild(inp);
        wrap.appendChild(hint);
        storyEl.appendChild(wrap);
      }
    });

    function startTimer() {
      if (started) return;
      started = true;
      interval = setInterval(() => {
        secs++;
        document.getElementById('timer').textContent =
          Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0');
      }, 1000);
    }

    function update() {
      const all = document.querySelectorAll('.b');
      let n = 0;
      all.forEach(inp => {
        const has = inp.value.trim().length > 0;
        inp.classList.toggle('done', has);
        if (has) n++;
      });
      document.getElementById('count').textContent = n + ' of ' + total + ' filled';
      document.getElementById('bar').style.width = Math.round(n / total * 100) + '%';
    }

    function clearAll() {
      document.querySelectorAll('.b').forEach(i => { i.value = ''; i.classList.remove('done'); });
      clearInterval(interval); started = false; secs = 0;
      document.getElementById('timer').textContent = '0:00';
      document.getElementById('result').style.display = 'none';
      update();
    }

    function showResult() {
      const inputs = Array.from(document.querySelectorAll('.b'));
      let idx = 0, html = '';
      parts.forEach(p => {
        if (!p.blank) {
          html += p.t;
        } else {
          const v = inputs[idx]?.value.trim() || '___';
          html += '<em>' + v + '</em>';
          idx++;
        }
      });
      document.getElementById('result-text').innerHTML = html;
      const box = document.getElementById('result');
      box.style.display = 'block';
      box.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  </script>
</body>
</html>
